<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V five-stage pipeline CPU project banner</title>
  <desc id="desc">Five connected pipeline stages, UART memory programming, seven-segment output, and verified project statistics</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.55" stop-color="#0d2939"/>
      <stop offset="1" stop-color="#24153f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1440" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1300" cy="60" r="230" fill="#7c3aed" opacity="0.12"/>
  <circle cx="80" cy="680" r="250" fill="#0891b2" opacity="0.12"/>
  <g transform="translate(88 106)">
    <text x="0" y="0" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">TINY TAPEOUT · VERILOG</text>
    <text x="0" y="82" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">RISC-V five-stage</text>
    <text x="0" y="152" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">pipeline CPU</text>
    <text x="0" y="210" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="24">UART-programmable memories · seven-segment output</text>
    <g transform="translate(0 270)" font-family="Segoe UI, Arial, sans-serif">
      <rect width="150" height="108" rx="18" fill="#123149" stroke="#22d3ee"/>
      <text x="75" y="51" text-anchor="middle" fill="#f8fafc" font-size="36" font-weight="800">45</text>
      <text x="75" y="82" text-anchor="middle" fill="#94a3b8" font-size="17">instructions</text>
      <rect x="170" width="150" height="108" rx="18" fill="#18243a" stroke="#64748b"/>
      <text x="245" y="51" text-anchor="middle" fill="#f8fafc" font-size="36" font-weight="800">5</text>
      <text x="245" y="82" text-anchor="middle" fill="#94a3b8" font-size="17">stages</text>
      <rect x="340" width="150" height="108" rx="18" fill="#251d42" stroke="#a78bfa"/>
      <text x="415" y="51" text-anchor="middle" fill="#f8fafc" font-size="36" font-weight="800">8x2</text>
      <text x="415" y="82" text-anchor="middle" fill="#94a3b8" font-size="17">tiles</text>
    </g>
    <rect x="0" y="410" width="490" height="86" rx="18" fill="#15352f" stroke="#34d399"/>
    <circle cx="44" cy="43" r="16" fill="#22c55e"/>
    <text x="78" y="36" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">RTL smoke test passed</text>
    <text x="78" y="64" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="18">Icarus 12.0 · Cocotb 1.8.1 · 2026-08-24</text>
  </g>
  <g transform="translate(660 106)" filter="url(#shadow)">
    <rect width="692" height="508" rx="30" fill="#0b1220" stroke="#334155"/>
    <text x="38" y="54" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">PIPELINE DATA PATH</text>
    <g transform="translate(42 112)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <rect x="0" y="0" width="104" height="92" rx="16" fill="#123149" stroke="#22d3ee"/>
      <text x="52" y="43" fill="#e0f2fe" font-size="26" font-weight="800">IF</text>
      <text x="52" y="70" fill="#67e8f9" font-size="15">FETCH</text>
      <rect x="126" y="0" width="104" height="92" rx="16" fill="#153044" stroke="#38bdf8"/>
      <text x="178" y="43" fill="#e0f2fe" font-size="26" font-weight="800">ID</text>
      <text x="178" y="70" fill="#7dd3fc" font-size="15">DECODE</text>
      <rect x="252" y="0" width="104" height="92" rx="16" fill="#1c2942" stroke="#818cf8"/>
      <text x="304" y="43" fill="#eef2ff" font-size="26" font-weight="800">EX</text>
      <text x="304" y="70" fill="#a5b4fc" font-size="15">EXECUTE</text>
      <rect x="378" y="0" width="104" height="92" rx="16" fill="#251f43" stroke="#a78bfa"/>
      <text x="430" y="43" fill="#f5f3ff" font-size="26" font-weight="800">MEM</text>
      <text x="430" y="70" fill="#c4b5fd" font-size="15">MEMORY</text>
      <rect x="504" y="0" width="104" height="92" rx="16" fill="#2e1e42" stroke="#c084fc"/>
      <text x="556" y="43" fill="#faf5ff" font-size="26" font-weight="800">WB</text>
      <text x="556" y="70" fill="#d8b4fe" font-size="15">WRITEBACK</text>
      <path d="M104 46 H126 M230 46 H252 M356 46 H378 M482 46 H504" stroke="url(#accent)" stroke-width="5"/>
    </g>
    <g transform="translate(42 266)" font-family="Segoe UI, Arial, sans-serif">
      <rect width="292" height="98" rx="18" fill="#12273a" stroke="#22d3ee"/>
      <text x="26" y="39" fill="#67e8f9" font-size="18">UART MEMORY ACCESS</text>
      <text x="26" y="72" fill="#f8fafc" font-size="22" font-weight="700">12-bit frames · 32-bit data</text>
      <rect x="316" width="292" height="98" rx="18" fill="#251d42" stroke="#a78bfa"/>
      <text x="342" y="39" fill="#c4b5fd" font-size="18">VISIBLE OUTPUT</text>
      <text x="342" y="72" fill="#f8fafc" font-size="22" font-weight="700">data_mem[0] → 7-segment</text>
    </g>
    <g transform="translate(42 410)" font-family="Segoe UI, Arial, sans-serif">
      <text x="0" y="0" fill="#94a3b8" font-size="18">EX forwarding</text>
      <rect x="132" y="-17" width="150" height="22" rx="11" fill="#152438"/>
      <rect x="132" y="-17" width="112" height="22" rx="11" fill="#22d3ee"/>
      <text x="316" y="0" fill="#94a3b8" font-size="18">Load-use stall</text>
      <rect x="452" y="-17" width="156" height="22" rx="11" fill="#3a2420"/>
      <text x="530" y="0" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="700">manual nop</text>
    </g>
    <text x="346" y="474" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="18">EVIDENCE-BASED README · NO PERSONAL IDENTIFIERS</text>
  </g>
</svg>
